<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#132b50"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="إدارة النادي"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/icon-192.png"><title>إدارة النادي</title><style>
:root{font-family:Tahoma,Arial,sans-serif;background:#f4f6fa;color:#17233a}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 18px;background:#214b88;color:white}button:disabled{opacity:.55}.muted{color:#7b8798}.top{background:#132b50;color:white;padding:24px max(18px,calc((100vw - 1120px)/2))}.top h1{margin:0 0 8px;font-size:25px}.top p{margin:0;color:#c4d2e6;font-size:14px}.wrap{max-width:1120px;margin:auto;padding:22px 16px}.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.stat,.panel{background:white;border:1px solid #e7eaf0;border-radius:18px;box-shadow:0 5px 22px #172b4910}.stat{padding:20px}.stat span{display:block;font-size:13px;color:#718098}.stat strong{display:block;font-size:25px;margin-top:12px;color:#172b4d}.tabs{display:flex;gap:9px;margin:22px 0}.tabs button{background:white;border:1px solid #dce3ee;color:#344968}.tabs button.active{background:#214b88;color:white}.panel{padding:25px}.panel h2{font-size:20px;margin:0 0 6px}.panel p{margin:0 0 22px;font-size:13px;color:#718098}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}label{display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:bold;color:#465571}input,select{padding:13px;border:1px solid #d8e0ea;border-radius:11px;background:white;width:100%;min-width:0;outline-color:#4076b8}input[readonly]{background:#f0f5fa;color:#17477c;font-weight:bold}.actions{display:flex;gap:10px;margin-top:22px}.outline{background:#edf2f8;color:#25466f}.hidden{display:none!important}.searchline{display:flex;gap:10px;flex-wrap:wrap}.searchline input{flex:2;min-width:200px}.searchline select{flex:1;min-width:150px}.result{padding:16px;margin-top:12px;border:1px solid #e2e8f1;border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:15px}.result strong{display:block;margin-bottom:7px}.result small{color:#6d7e96;line-height:1.8}.hint{padding:13px;border-radius:11px;background:#f1f5fb;color:#526884;font-size:13px;margin-top:15px}.message{margin-top:15px;color:#1e6581;font-size:14px}.foot{margin-top:20px;font-size:12px;color:#7b8798}@media(max-width:850px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:540px){.wrap{padding:13px}.top{padding:22px 17px}.stat{padding:15px}.stat strong{font-size:21px}.grid{grid-template-columns:1fr}.panel{padding:17px}.tabs button{flex:1;padding:11px 8px}.result{align-items:start;flex-direction:column}.result button{width:100%}}
 .install-app{margin-top:12px;background:#f5b400;color:#17233a;font-weight:bold}.install-app[hidden]{display:none} </style></head><body><header class="top"><h1>إدارة النادي</h1><p>الاشتراكات · الدفعات · الذمم المالية</p></header><main class="wrap"><div class="stats" id="stats"></div><nav class="tabs"><button class="active" data-view="add">إضافة مشترك</button><button data-view="search">بحث وتعديل</button><button data-view="debts">الذمم</button></nav><button id="installApp" class="install-app" hidden type="button">تثبيت التطبيق على الجهاز</button><section id="add" class="panel"><h2 id="formTitle">إضافة مشترك جديد</h2><p>أدخل البيانات واختر نوع الاشتراك، وسيُحسب الباقي مباشرة.</p><form id="form"><div class="grid"><label>نوع الاشتراك<select id="sheet"><option>الاشتراكات</option><option>الاشتراكات الخاصة</option></select></label><label>الاسم الكامل<input id="name" required autocomplete="name"></label><label>رقم الهاتف<input id="phone" type="tel" inputmode="tel"></label><label>المواصلات<select id="transport"><option>لا</option><option>نعم</option></select></label><label>الدورة<input id="course"></label><label>تاريخ الاشتراك<input id="date" type="date"></label><label>التكلفة<input id="cost" type="number" min="0" step="any" required></label><label>الدفعة الأولى<input id="pay1" type="number" min="0" step="any" value="0"></label><label>الدفعة الثانية<input id="pay2" type="number" min="0" step="any" value="0"></label><label>الباقي<input id="balance" readonly></label></div><div class="actions"><button id="save" type="submit">حفظ المشترك</button><button type="button" class="outline" id="clear">تفريغ النموذج</button></div></form></section><section id="search" class="panel hidden"><h2>البحث عن مشترك</h2><p>تظهر النتائج فقط عند إدخال اسم أو رقم هاتف.</p><div class="searchline"><input id="query" placeholder="الاسم الكامل أو رقم الهاتف"><select id="scope"><option value="all">جميع الاشتراكات</option><option>الاشتراكات</option><option>الاشتراكات الخاصة</option></select><button id="find">بحث</button></div><div id="results"></div></section><section id="debts" class="panel hidden"><h2>الذمم المالية</h2><p>المشتركون الذين لديهم مبلغ متبقٍ، مع إمكانية فتح بياناتهم للتعديل.</p><div class="searchline"><input id="debtQuery" placeholder="بحث ضمن الذمم بالاسم أو الهاتف"><button id="debtFind">بحث</button></div><div id="debtResults"></div></section><div id="status" class="message" role="status"></div><div class="foot" id="connection"></div></main><script>
// أدخل رابط Apps Script Web App بعد نشر وسيط الكتابة. لا تنشر وسيط كتابة مفتوحًا للجميع.
const API_URL='https://script.google.com/macros/s/AKfycbwhFGfoVbPeJJqSgkx7W1hE4si41nI72StrotxSZnAbHWkc_RkYF0rt2pioZ2bWTXmdiw/exec';// CSV المنشور يصلح للقراءة فقط، وقد يعرض ورقة واحدة فقط.
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vQWIN6RYwSEOeyK5O8IrAB6sYiZ-us5myyy_s4MRk43OkIJpQLipxiALSOMjh5eyfJYWMexwIG5rls_/pub?output=csv';
const $=id=>document.getElementById(id);let records=[],editing=null;const num=v=>Number(String(v||0).replace(/[,،\s]/g,''))||0;const fmt=v=>new Intl.NumberFormat('ar',{maximumFractionDigits:2}).format(v);const clean=v=>String(v??'').trim();
function csvParse(s){let out=[],r=[],v='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(q&&s[i+1]==='"'){v+='"';i++}else q=!q}else if(c===','&&!q){r.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&s[i+1]==='\n')i++;r.push(v);if(r.some(Boolean))out.push(r);r=[];v=''}else v+=c}r.push(v);if(r.some(Boolean))out.push(r);return out}
function dateValue(v){if(!v)return '';let d=String(v).trim();if(/^\d{4}-\d{2}-\d{2}$/.test(d))return d;let p=d.split(/[\/.-]/);if(p.length===3){if(p[2].length===4)return `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;if(p[0].length===4)return `${p[0]}-${p[1].padStart(2,'0')}-${p[2].padStart(2,'0')}`}return ''}
function renderStats(){let a=records.filter(r=>r.sheet==='الاشتراكات').length,b=records.filter(r=>r.sheet==='الاشتراكات الخاصة').length,income=records.reduce((s,r)=>s+num(r.pay1)+num(r.pay2),0),debt=records.reduce((s,r)=>s+Math.max(0,num(r.cost)-num(r.pay1)-num(r.pay2)),0);$('stats').replaceChildren();[['الاشتراكات',a],['الاشتراكات الخاصة',b],['مجموع المشتركين',a+b],['مجموع الإيرادات',fmt(income)],['مجموع الذمم',fmt(debt)]].forEach(([label,value])=>{let card=document.createElement('article');card.className='stat';let sp=document.createElement('span');sp.textContent=label;let strong=document.createElement('strong');strong.textContent=value;card.append(sp,strong);$('stats').append(card)})}
function resultList(container,list){container.replaceChildren();if(!list.length){let p=document.createElement('div');p.className='hint';p.textContent='لا توجد نتائج مطابقة.';container.append(p);return}for(let r of list.slice(0,100)){let item=document.createElement('div');item.className='result';let info=document.createElement('div'),title=document.createElement('strong'),sub=document.createElement('small');title.textContent=r.name;sub.textContent=`${r.phone||'بدون هاتف'} · ${r.sheet} · ${r.course||'بدون دورة'} · الباقي: ${fmt(num(r.cost)-num(r.pay1)-num(r.pay2))}`;info.append(title,sub);let b=document.createElement('button');b.className='outline';b.textContent='فتح وتعديل';b.onclick=()=>edit(r);item.append(info,b);container.append(item)}}
function search(debts=false){let term=clean($(debts?'debtQuery':'query').value).toLowerCase();if(!term&&!debts){$('results').replaceChildren();return}let scope=$('scope').value;let list=records.filter(r=>(!debts||num(r.cost)-num(r.pay1)-num(r.pay2)!==0)&&(debts||scope==='all'||r.sheet===scope)&&(!term||[r.name,r.phone].some(v=>clean(v).toLowerCase().includes(term))));resultList($(debts?'debtResults':'results'),list)}
function switchView(v){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));['add','search','debts'].forEach(id=>$(id).classList.toggle('hidden',id!==v));if(v==='debts')search(true)}
function balance(){$('balance').value=fmt(num($('cost').value)-num($('pay1').value)-num($('pay2').value))}
function reset(){editing=null;$('form').reset();$('date').value=new Date().toLocaleDateString('en-CA');$('sheet').disabled=false;$('formTitle').textContent='إضافة مشترك جديد';$('save').textContent='حفظ المشترك';balance()}
function edit(r){editing={sheet:r.sheet,row:r.row};$('sheet').value=r.sheet;$('sheet').disabled=true;for(let id of ['name','phone','transport','course','cost','pay1','pay2'])$(id).value=r[id]??'';$('date').value=dateValue(r.date);$('formTitle').textContent='تعديل بيانات المشترك';$('save').textContent='حفظ التعديلات';balance();switchView('add');window.scrollTo({top:0,behavior:'smooth'})}
async function load(){try{if(API_URL){let res=await fetch(API_URL+'?action=list&t='+Date.now());let data=await res.json();if(!data.ok)throw Error(data.error);records=data.records;$('connection').textContent='تم الاتصال بمصدر البيانات.'}else{let res=await fetch(CSV_URL+'&t='+Date.now());if(!res.ok)throw Error('تعذر جلب CSV');let rows=csvParse(await res.text());records=rows.slice(1).filter(r=>clean(r[0])).map((r,i)=>({sheet:'الاشتراكات',row:i+2,name:clean(r[0]),phone:clean(r[1]),transport:clean(r[2]),course:clean(r[3]),date:clean(r[4]),cost:num(r[5]),pay1:num(r[6]),pay2:num(r[7])}));$('connection').textContent='وضع قراءة CSV: الإحصائيات والبحث قد لا يشملان الاشتراكات الخاصة. الحفظ والتعديل غير مفعلين حتى ربط واجهة كتابة آمنة.'}renderStats()}catch(e){$('connection').textContent='تعذر الاتصال: '+e.message}}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{if(b.dataset.view==='add'&&!editing)reset();switchView(b.dataset.view)});$('find').onclick=()=>search(false);$('query').oninput=()=>search(false);$('scope').onchange=()=>search(false);$('debtFind').onclick=()=>search(true);$('debtQuery').oninput=()=>search(true);$('clear').onclick=reset;['cost','pay1','pay2'].forEach(id=>$(id).oninput=balance);
$('form').onsubmit=async e=>{e.preventDefault();if(!API_URL){$('status').textContent='الحفظ غير متاح عبر CSV. يجب ربط خدمة كتابة محمية أولًا.';return}let payload={action:'save',sheet:$('sheet').value,row:editing?.row||0,name:clean($('name').value),phone:clean($('phone').value),transport:$('transport').value,course:clean($('course').value),date:$('date').value,cost:num($('cost').value),pay1:num($('pay1').value),pay2:num($('pay2').value)};if(!payload.name)return;$('save').disabled=true;$('status').textContent='جارٍ الحفظ...';try{let res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});let data=await res.json();if(!data.ok)throw Error(data.error);$('status').textContent='تم الحفظ بنجاح';reset();await load();switchView('search')}catch(err){$('status').textContent='فشل الحفظ: '+err.message}finally{$('save').disabled=false}};reset();renderStats();load();
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;document.getElementById('installApp').hidden=false});
document.getElementById('installApp').addEventListener('click',async()=>{if(!deferredInstallPrompt)return;deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;document.getElementById('installApp').hidden=true});
window.addEventListener('appinstalled',()=>{document.getElementById('installApp').hidden=true});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}
</script></body></html>
